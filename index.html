
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#4a5240">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aplo Blossom">
  <title>Aplo Blossom — Studio</title>
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
 
  <!-- exportar inventario -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Librerías externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js para las gráficas financieras -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- CSS (externo) -->
  <link rel="stylesheet" href="styles.css?v=1779471067">
</head>
<body>

<div id="app">

  <!-- ══════════════════════════════════════
       SIDEBAR (visible solo en desktop)
  ══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <div class="brand-label">Mi Negocio</div>
      <div class="brand-name">Aplo Blossom</div>
    </div>

    <!-- (Se eliminó el Saldo en cuenta superior según tu solicitud) -->

    <!-- Stats rápidos -->
    <div class="sidebar-stats">
      <div class="sidebar-stat">
        <span class="ss-label">Productos</span>
        <span class="ss-val" id="statProducts">—</span>
      </div>
      <div class="sidebar-stat" onclick="showLowStockModal()" style="cursor:pointer;">
        <span class="ss-label">Stock bajo ⚠️</span>
        <span class="ss-val" id="statLow">—</span>
      </div>
      <div class="sidebar-stat">
        <span class="ss-label">Ventas hoy</span>
        <span class="ss-val" id="statToday">—</span>
      </div>
    </div>

    <!-- Navegación principal -->
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="setTab(0)" id="nav0">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Inventario</span>
      </button>
      <button class="nav-item" onclick="setTab(1)" id="nav1">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Cotizar</span>
      </button>
      <button class="nav-item" onclick="setTab(2)" id="nav2">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Ventas</span>
      </button>
      <button class="nav-item" onclick="setTab(6)" id="nav6">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Abonos</span>
      </button>
      <button class="nav-item" onclick="setTab(3)" id="nav3">
        <svg viewBox="0 0 24 24"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
        <span>Reportes</span>
      </button>
      <button class="nav-item" onclick="setTab(4)" id="nav4">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Finanzas</span>
      </button>
      <button class="nav-item" onclick="setTab(5)" id="nav5">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <span>Catálogo</span>
      </button>
    </nav>

  </aside><!-- /sidebar -->


  <!-- ══════════════════════════════════════
       CABECERA MÓVIL (visible solo en mobile)
  ══════════════════════════════════════ -->
  <div class="mobile-header" id="mobileHeader">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
      <div>
        <div style="font-size:9px;letter-spacing:3px;color:var(--olive-pale);font-weight:500;text-transform:uppercase;margin-bottom:2px;">Mi Negocio</div>
        <div class="brand-name">Aplo Blossom</div>
      </div>
      <!-- (Se eliminó el Saldo en cuenta superior en móvil) -->
    </div>

    <!-- Stats rápidos (mobile) -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
      <div style="background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.06);">
        <div id="statProducts" style="font-family:'Playfair Display',serif;font-size:18px;font-weight:400;color:var(--cream);">—</div>
        <div style="font-size:9px;color:var(--olive-pale);letter-spacing:.4px;margin-top:1px;">Productos</div>
      </div>
      <div onclick="showLowStockModal()" style="cursor:pointer;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.06);">
        <div id="statLow" style="font-family:'Playfair Display',serif;font-size:18px;font-weight:400;color:var(--cream);">—</div>
        <div style="font-size:9px;color:var(--olive-pale);letter-spacing:.4px;margin-top:1px;">Stock bajo</div>
      </div>
      <div style="background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.06);">
        <div id="statToday" style="font-family:'Playfair Display',serif;font-size:18px;font-weight:400;color:var(--cream);">—</div>
        <div style="font-size:9px;color:var(--olive-pale);letter-spacing:.4px;margin-top:1px;">Ventas hoy</div>
      </div>
    </div>

  </div><!-- /mobile-header -->


  <!-- ══════════════════════════════════════
       ÁREA PRINCIPAL DE CONTENIDO
  ══════════════════════════════════════ -->
  <div class="main-area">
    <div class="content" id="mainContent">
      <!-- Estado de carga inicial -->
      <div class="loading">
        <div class="spinner"></div>
        <p style="color:var(--text-light);font-size:13px;">Cargando...</p>
      </div>
    </div>
  </div><!-- /main-area -->


  <!-- ══════════════════════════════════════
       NAVEGACIÓN INFERIOR (visible solo en mobile)
  ══════════════════════════════════════ -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="mobile-nav-btn active" onclick="setTab(0)" id="mnav0">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Inventario</span>
    </button>
    <button class="mobile-nav-btn" onclick="setTab(1)" id="mnav1">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span>Cotizar</span>
    </button>
    <button class="mobile-nav-btn" onclick="setTab(2)" id="mnav2">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Ventas</span>
    </button>
    <button class="mobile-nav-btn" onclick="setTab(6)" id="mnav6">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Abonos</span>
    </button>
    <button class="mobile-nav-btn" onclick="setTab(3)" id="mnav3">
      <svg viewBox="0 0 24 24"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
      <span>Reportes</span>
    </button>
    <button class="mobile-nav-btn" onclick="setTab(4)" id="mnav4">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Finanzas</span>
    </button>
    <button class="mobile-nav-btn" onclick="setTab(5)" id="mnav5">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Catálogo</span>
    </button>
  </nav><!-- /bottom-nav -->

</div><!-- /app -->

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- JS (externo) -->
<script type="module" src="js/main.js"></script>

</body>
</html>
